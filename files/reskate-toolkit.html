  HOW IT IS BUILT (for future updates)

  * This file is the SHELL: header, navigation, home dashboard and the module registry (MODULES below).
  * Every tool is a self-contained MODULE (its own HTML document, apps/<id>.html, built by build.py)

  * Shell -> module messages:  {rs:'lang', lang:'nl'|'en'}  {rs:'help', on:bool}  {rs:'profile', profile:{...}}
    Module -> shell message:   {rs:'ready', module:'<id>'}

<script>"use strict";const VERSION="8.9.0",CHANGELOG=[{v:"8.9.0",nl:["Elke app heeft nu een eigen stijl, binnen dezelfde hub.","Clothing Manager — denim-werkplaats: indigo stof, goudkleurig stiksel als accent, stippellijnen als naden tussen de secties, titels als een waslabel (IBM Plex) en schuifregelaars met een koperen klinknagel.","Patches — borduurwerk: donkergroene keperstof, rood en crème garen, afgeronde vormen met een stiksel aan de binnenkant van de kaarten, een zacht rond lettertype (Nunito) en schuifregelaars als een dikke draad met een kraal.","Logo Maker — drukkerij: licht papier met zwarte inkt, rechte hoeken, rood alleen voor acties, blauw voor selecties, een lichte transparantie-ruit en koppen als een letterproef (Archivo).","Video Editor houdt zijn regietafel-look (8.8). De hub blijft de gedeelde Brazy-stijl."],en:["Every app now has its own style, inside the same hub.","Clothing Manager — denim workshop: indigo cloth, topstitch gold as the accent, stitched lines between the sections, titles like a care label (IBM Plex) and sliders with a copper rivet.","Patches — embroidery: dark green twill, red and cream thread, rounded shapes with a stitch line inside the cards, a soft rounded typeface (Nunito) and sliders like a thick thread with a bead.","Logo Maker — print studio: light paper with black ink, square corners, red only for actions, blue for selections, a light transparency checker and headings like a type specimen (Archivo).","The Video Editor keeps its console look (8.8). The hub keeps the shared Brazy style."]},{v:"8.8.0",nl:["Video Editor — nieuwe look: warme grijstinten in plaats van fel groen op zwart, één signaalkleur (oranje) alleen voor wat telt (afspeelkop, selectie, opnemen, Exporteren, 'aan'-lampjes), kleine strakke hoeken, eigen lettertypes (Barlow en JetBrains Mono, ingebouwd zodat het offline hetzelfde is) en schuifregelaars met een fader-knop.","Video Editor — indeling: de balk van de editor staat nu alleen boven het voorbeeld, zodat de zijpanelen de volle hoogte krijgen. De zijpanelen kun je breder en smaller slepen of inklappen (pijltje op de rand, of klik nogmaals op het actieve knopje links). Meldingen verschijnen rechtsonder in plaats van over het beeld.","Effecten: zoekveld, categorieën links en een lijst rechts. Wijs een effect aan en je ziet het meteen op je eigen clip in het voorbeeld; de miniaturen tonen een beeld uit je eigen video.","Tijdlijn: de knoppen zijn gegroepeerd en benoemd (Gereedschap, Bewerken, Toevoegen, Tijdlijn, Uitlijnen, Sporen, Zoom), spoorhoogte S/M/L staat er direct op, en muziek krijgt vanzelf oranje kick-markeringen.","Inspector: breder met langere schuifregelaars; sleep op de naam of het getal van een instelling om de waarde te veranderen (Shift = fijn); keyframe-knopjes verschijnen pas als je over de rij gaat of als er keyframes zijn."],en:["Video Editor — new look: warm greys instead of bright green on black, one signal colour (orange) only for what matters (playhead, selection, record, Export, 'on' lights), small tight corners, its own fonts (Barlow and JetBrains Mono, built in so it looks the same offline) and sliders with a fader cap.","Video Editor — layout: the editor's bar now sits above the preview only, so the side panels get the full height. You can drag the side panels wider or narrower, or fold them away (arrow on the edge, or click the active rail button again). Messages appear bottom right instead of over the picture.","Effects: search box, categories on the left and a list on the right. Hover an effect and you see it straight away on your own clip in the preview; the thumbnails show a frame of your own video.","Timeline: the buttons are grouped and labelled (Tool, Edit, Add, Timeline, Snap, Tracks, Zoom), track height S/M/L is right on it, and music gets orange kick markers by itself.","Inspector: wider, with longer sliders; drag on a setting's name or number to change it (Shift = fine); keyframe buttons only show when you hover the row or when there are keyframes."]},{v:"8.7.1",nl:["Logo Maker: het kleurpaneel heeft nu dezelfde kleurenring met driehoek als de andere apps (in plaats van het vierkant met de kleurbalk), met de hex-code en pipet eronder.","Clothing Manager: op een trage grafische kaart gaat het patroon tijdens het slepen van een schuifregelaar nu ook echt naar een lagere resolutie (vlotter slepen)."],en:["Logo Maker: the colour panel now has the same colour ring with triangle as the other apps (instead of the square with the hue bar), with the hex code and eyedropper underneath.","Clothing Manager: on a slow graphics card the pattern now really drops to a lower resolution while you drag a slider (smoother dragging)."]},{v:"8.7.0",nl:["Video Editor — één echte fisheye: gebouwd op de projectie van echte fisheye-lenzen (equisolid). Midden groot, rechte lijnen buigen naar de rand, het glas wordt donkerder en zachter aan de rand, kleurranden, en standaard de afgeronde zwarte hoeken van een VX1000 met MK1. Instelbaar van subtiel tot een volledige cirkel. Fisheye (MK1) en Fisheye rechtzetten zijn samengevoegd.","Nieuwe categorie 'Op de beat' met 10 effecten gemaakt om op de kick te slaan: Bounce, Duw opzij, Draai-hit, Belichtingspunch, Kleur op de beat, Negatief-flits, Raster-split, Vignet-pomp, Zoom-echo en Vervagings-hit. Bewegingen veren terug met een kleine overshoot. Allemaal met één klik bij 'Op de beat'.","Opgeruimd: dubbele en minder bruikbare effecten (o.a. olieverf, waterverf, röntgen, draaikolk, tunnel) staan niet meer in de lijst — projecten die ze gebruiken spelen ze nog gewoon af."],en:["Video Editor — one real fisheye: built on the projection of real fisheye lenses (equisolid). Big in the middle, straight lines bending towards the edge, the glass darker and softer at the rim, colour fringes, and by default the rounded black corners of a VX1000 with an MK1. Adjustable from subtle to a full circle. Fisheye (MK1) and Fisheye fix are merged.","New 'On the beat' category with 10 effects made to hit on the kick: Bounce, Push, Spin hit, Exposure punch, Colour on the beat, Invert flash, Grid split, Vignette pump, Zoom echo and Blur hit. Movements spring back with a small overshoot. All one click away under 'On the beat'.","Cleaned up: duplicate and less useful effects (e.g. oil paint, watercolour, x-ray, swirl, tunnel) are no longer in the list — projects that use them still play them."]},{v:"8.6.1",nl:["Beat sync nog beter (getest op echte trap- en hiphopnummers): één beat per kick of 808-noot — het golven van een lange 808 telt niet meer als nieuwe beat; zachte kicks in rustige stukken worden ook gevonden; kicks onder zang worden niet meer voor een snare aangezien. Het BPM-getal klopt ook beter."],en:["Beat sync even better (tested on real trap and hip-hop tracks): one beat per kick or 808 note — the wobble of a long 808 no longer counts as a new beat; soft kicks in quiet parts are found too; kicks under vocals are no longer mistaken for a snare. The BPM number is more accurate as well."]},{v:"8.6.0",nl:["Video Editor — beat sync volgt nu de kick en de bas: de beats liggen precies op elke kick (binnen een paar milliseconden), snares, claps en hi-hats tellen niet meer mee. Ook gesyncopeerde hiphop-kicks en four-on-the-floor werken; muziek zonder kick of bas krijgt zoals vroeger een vast ritme.","Exporteren: de volgende beelden worden al gedecodeerd terwijl het huidige getekend en gecodeerd wordt, en er wordt minder gewacht tussen de beelden — zelfde kwaliteit. Na de export zie je hoeveel beelden per seconde het ging; het prestatierapport toont waar de tijd naartoe ging."],en:["Video Editor — beat sync now follows the kick and the bass: beats sit exactly on every kick (within a few milliseconds); snares, claps and hi-hats no longer count. Syncopated hip-hop kicks and four-on-the-floor work too; music without a kick or bass gets a steady grid as before.","Export: the next frames are already decoded while the current one is drawn and encoded, and there is less waiting between frames — same quality. After the export you see how many frames per second it ran; the performance report shows where the time went."]},{v:"8.5.1",nl:["Patches: een PNG wordt weer gebruikt zoals hij is — de lege transparante ruimte wordt niet meer weggeknipt en het logo niet meer gecentreerd, zodat de plaatsing uit je PNG behouden blijft."],en:["Patches: a PNG is used as it is again — empty transparent space is no longer trimmed and the logo no longer centred, so the placement from your PNG is kept."]},{v:"8.5.0",nl:["Logo Maker: alle laageffecten draaien nu op de grafische kaart — omlijningen, gloed, schaduw, bevel, binnenschaduw, randen (ruw, krimpen, afronden), texturen en vervorming. Zelfde resultaat, maar veel sneller bij grote logo's en exports; zonder geschikte grafische kaart werkt het zoals voorheen.","360°-video's (Clothing Manager) en geanimeerde logo's gebruiken nu de video-encoder van de grafische kaart (bv. NVENC) — sneller opslaan.","Ruwe randen en 'groeien' op afbeeldingslagen kregen hun kleur van de verkeerde plek; opgelost."],en:["Logo Maker: every layer effect now runs on the graphics card — outlines, glow, shadow, bevel, inner shadow, edges (rough, shrink, smooth), textures and distortion. Same result, much faster on big logos and exports; without a suitable graphics card it works as before.","360° videos (Clothing Manager) and animated logos now use the graphics card's video encoder (e.g. NVENC) — faster saving.","Rough edges and 'grow' on image layers took their colour from the wrong place; fixed."]},{v:"8.4.0",nl:['Exportmap in Instellingen (desktop-app): kies één map voor al je exports, met eventueel een map per app (Clothing\\Pants, Logos, Videos, Patches…) en of een bestaand bestand vervangen wordt of beide bewaard blijven. Klik op de melding "Opgeslagen" om het bestand in Verkenner te tonen.',"Herstel na een crash: alle apps die open stonden komen terug zoals ze waren — met hun project en 3D-model — ook na een stroomonderbreking of een vastgelopen pc.",'Prestatierapport meet nu de verversing van je scherm (Hz) en elke keer dat je iets sleept (schuifregelaar, tijdlijn, 3D): hoeveel beelden te laat kwamen en of de processor of de grafische kaart de oorzaak was. Bovenaan staat een korte uitleg in gewone woorden; "Opslaan als bestand" om het door te sturen.'],en:['Export folder in Settings (desktop app): choose one folder for all your exports, optionally with a folder per app (Clothing\\Pants, Logos, Videos, Patches…) and whether an existing file is replaced or both are kept. Click the "Saved" message to show the file in Explorer.',"Crash recovery: every app that was open comes back as it was — with its project and 3D model — also after a power cut or a frozen PC.",'The performance report now measures your screen\'s refresh rate (Hz) and every drag (slider, timeline, 3D): how many frames were late and whether the processor or the graphics card was the cause. A short summary in plain words is at the top; "Save as file" to send it on.']},{v:"8.3.1",nl:["360°-video/GIF: het venster opent meteen en opslaan gaat veel sneller (de kledingstof wordt één keer berekend in plaats van per beeld). Ook '360° naar de Video Editor' en het lookbook zijn daardoor sneller."],en:["360° video/GIF: the window opens right away and saving is much faster (the garment texture is worked out once instead of for every frame). '360° to the Video Editor' and the lookbook are faster too."]},{v:"8.3.0",nl:['Clothing Manager: twee patronen op één kledingstuk — bv. camo op de mouwen en strepen op het lijf. Kies bovenaan bij Patroon of je Patroon 1 of 2 bewerkt en zet bij Zones een zone op "Patroon 2". Bij export wordt alles in de Base color gebakken.',"Nieuw: Slijtage — schaafplekken en krassen op de uitstekende delen, verbleekte vlekken en vuil in plooien en randen, per zone in te stellen (bv. veel op de zool en neus van een schoen). Wordt mee gebakken bij export.","360°-video of GIF opslaan (3D → 360° & mockup): MP4, GIF of WebM, 3–8 seconden, tot 1080 px, op een donkere, transparante of mockup-achtergrond, met een bewegend voorbeeld. De Logo Maker gebruikt nu dezelfde video- en GIF-maker."],en:['Clothing Manager: two patterns on one garment — e.g. camo on the sleeves and stripes on the body. At the top of Pattern choose whether you edit Pattern 1 or 2, and set a zone to "Pattern 2" under Zones. On export everything is baked into the Base color.',"New: Wear & tear — scuffs and scratches on raised parts, faded patches and dirt in creases and edges, adjustable per zone (e.g. a lot on the sole and toe of a shoe). Baked in on export.","Save a 360° video or GIF (3D → 360° & mockup): MP4, GIF or WebM, 3–8 seconds, up to 1080 px, on a dark, transparent or mockup background, with a moving preview. The Logo Maker now uses the same video and GIF maker."]},{v:"8.2.0",nl:["Nieuw in Instellingen: 'Over & licenties' — welke versie je draait (app, inhoud, Electron) en welke onderdelen van anderen erin zitten, met hun licentie. 'Info kopiëren' zet alles klaar om door te sturen als er iets misloopt.","Achter de schermen: de startpagina is opgesplitst in losse bronbestanden zoals de andere apps en wordt nu verkleind meegeleverd (~11 % kleiner)."],en:["New in Settings: 'About & licences' — which version you run (app, content, Electron) and which parts made by others are inside, with their licence. 'Copy info' gets everything ready to send when something goes wrong.","Behind the scenes: the start page is split into separate source files like the other apps and now ships minified (~11% smaller)."]},{v:"8.1.0",nl:["Geheugen vrijmaken: een app die je een tijd niet gebruikt, wordt na het bewaren gesloten als het geheugen krap wordt (of na 45 minuten). Open je hem weer, dan staat alles waar je was — de Clothing Manager laadt ook het model terug. Aan/uit in Instellingen.","Logo Maker start ~35 % sneller: lettertypen worden pas geladen als een tekst ze gebruikt (de rest daarna op de achtergrond). Logo Maker en Video Editor delen nu één lettertype- en iconenlader."],en:["Free memory: an app you have not used for a while is saved and closed when memory gets tight (or after 45 minutes). Open it again and everything is where you left it — the Clothing Manager reloads its model too. On/off in Settings.","Logo Maker starts ~35% faster: fonts are loaded only when a text uses them (the rest later in the background). The Logo Maker and Video Editor now share one font and icon loader."]},{v:"8.0.0",nl:["Automatische updates: de app kijkt bij het starten en elk uur, downloadt een nieuwe versie stil op de achtergrond (alleen wat veranderd is) en vraagt dan of je ze nu wilt installeren — je werk wordt eerst bewaard.","De app zelf wordt nu ook bijgewerkt (niet alleen de toolkit): na deze installatie heb je nooit meer een installer nodig. Gaat een bijgewerkte app ooit niet goed op, dan start automatisch de vorige.","Modellen en base maps zijn echte binaire bestanden: ~25 % kleiner (126 → 95 MB) en sneller te openen.","Elke app is een eigen bestand in de app: updates downloaden alleen de app die veranderd is; de losse app-bestanden in je projectmap zijn weg.","Eénmalig: installeer Brazy Toolkit Setup 8.0.0 (oudere versies kunnen deze update niet zelf installeren)."],en:["Automatic updates: the app checks at start and every hour, quietly downloads a new version in the background (only what changed) and then asks whether to install it now — your work is saved first.","The app itself now updates too (not only the toolkit): after this install you never need an installer again. If an updated app ever fails to start, the previous one starts automatically.","Models and base maps are real binary files: ~25% smaller (126 → 95 MB) and faster to open.","Every app is its own file inside the app: updates only download the app that changed; the loose app files in your project folder are gone.","One time only: install Brazy Toolkit Setup 8.0.0 (older versions cannot install this update themselves)."]},{v:"7.5.1",nl:["Kleiner en sneller: de toolkit-pagina is 60 % kleiner (2,4 MB → 0,97 MB) — elke app zit er gecomprimeerd in en wordt pas uitgepakt als je hem opent; de hub start ongeveer een derde sneller.","Alle apps zijn ~20 % kleiner (geminimaliseerde code); Logo Maker start sneller (lettertypen worden sneller ingeladen).","Video Editor: bewerken in grote projecten is tot 4× vlotter (de tijdlijn hergebruikt ongewijzigde clips en tekent zonder steeds alles opnieuw op te meten); ongedaan maken gebruikt bij grote projecten niet meer onbeperkt geheugen.","Clothing Manager: shaders worden pas gebouwd als ze nodig zijn (de rest op de achtergrond), en de grip-uitsnede wordt alleen voor skateboards aangemaakt (sneller openen, ~5 MB minder geheugen)."],en:["Smaller and faster: the toolkit page is 60% smaller (2.4 MB → 0.97 MB) — every app is stored compressed and unpacked only when you open it; the hub starts about a third faster.","Every app is ~20% smaller (minified code); the Logo Maker starts faster (fonts load faster).","Video Editor: editing big projects is up to 4× smoother (the timeline reuses unchanged clips and no longer re-measures everything for each clip); undo no longer uses unlimited memory on big projects.","Clothing Manager: shaders are built when first needed (the rest in the background), and the grip cutout is only made for skateboards (faster to open, ~5 MB less memory)."]},{v:"7.5.0",nl:["Onderhoudsversie: de code achter de toolkit is opnieuw geordend, zonder nieuwe functies — alles werkt en ziet eruit zoals in 7.4.5.","Clothing Manager en Patches bestaan nu uit losse bronbestanden en delen hun hulpcode; de patroon-shaders worden per stijl al bij het bouwen samengesteld (zelfde beeld, pixel voor pixel).","Snellere en veiligere updates: één pakket per versie voor de pc, en de tests draaien parallel."],en:["Maintenance release: the code behind the toolkit has been reorganised, with no new features — everything works and looks as in 7.4.5.","The Clothing Manager and Patches are now made of separate source files and share their helper code; the pattern shaders are put together per style at build time (same picture, pixel for pixel).","Faster, safer updates: one package per version for the PC, and the tests run in parallel."]},{v:"7.4.5",nl:['Video Editor: nieuwe schakelaar "Magnetisch / Vrij plaatsen" in de tijdlijnbalk (sneltoets G). Op Vrij blijft een clip staan waar je hem loslaat, ook met een gat ervoor — hij plakt niet meer terug tegen de vorige clip.',"Geluid onder een videoclip groter of kleiner maken: sleep de bovenrand van de geluidsstrook (het spoor wordt mee hoger).","Golfvorm-zoom per spoor (video en audio): knop in de spoorkop, Ctrl+Shift+scroll op een clip of rechtsklik op het spoor. De pieken worden groter om beter uit te lijnen — het volume (dB) blijft gelijk."],en:['Video Editor: new "Magnetic / Free" switch in the timeline bar (shortcut G). On Free a clip stays exactly where you drop it, gap and all — it no longer glues back to the previous clip.',"Make the sound under a video clip bigger or smaller: drag the top edge of the sound strip (the track grows along).","Waveform zoom per track (video and audio): button in the track header, Ctrl+Shift+scroll on a clip or right-click the track. The spikes get bigger for lining things up — the volume (dB) stays the same."]},{v:"7.4.4",nl:["Patroongenerator sneller: het snelle voorbeeld rekende elke pixel 5× uit, nu 1× — live schuiven is 2 tot 15× sneller (resultaat pixel-gelijk).","Andere stijl kiezen gaat direct: de stijlen worden op de achtergrond voorbereid terwijl je werkt.","Op een tragere grafische kaart volgt het voorbeeld tijdens het schuiven op lagere resolutie en springt het meteen terug naar volle grootte als je loslaat."],en:["Pattern generator faster: the quick preview computed every pixel 5×, now once — live dragging is 2 to 15× faster (pixel-identical result).","Switching style is instant: styles are prepared in the background while you work.","On a slower graphics card the preview follows your drag at lower resolution and snaps back to full size as soon as you let go."]},{v:"7.4.3",nl:['Clothing Manager: het blok "Kant-en-klare looks" in de patroongenerator is weg — kies een stijl in het menu (alle denim-varianten, stoffen en prints staan daar).'],en:['Clothing Manager: the "Ready-made looks" block in the pattern generator is gone — pick a style in the menu (all denim variants, fabrics and prints are there).']},{v:"7.4.2",nl:["Clothing Manager nog sneller: elke stijl krijgt een klein eigen shaderprogramma met alleen de code die hij nodig heeft (5× kleiner, snel te compileren én te tekenen), en de voorbeeldjes van de kant-en-klare looks zitten nu ingebouwd — bij het openen moet de grafische kaart niets meer voorbereiden."],en:["Clothing Manager even faster: every style gets its own small shader program with only the code it needs (5× smaller, quick to compile and to draw), and the previews of the ready-made looks are now built in — nothing for the graphics card to prepare when it opens."]},{v:"7.4.1",nl:["Clothing Manager weer vlot: de kant-en-klare looks maakten bij het openen tientallen shaders en tekenden het patroon telkens opnieuw — nu één shader, de voorbeelden worden één keer gemaakt en bewaard, en het scherpe 4×-patroon wordt alleen bij export berekend (of kies 'Ook scherp voorbeeld').","Grote patronen worden in stroken berekend zodat de grafische kaart niet vastloopt, en de plaatsing in de tegelweergave wordt niet meer bij elke redraw opnieuw berekend (plus een fout opgelost waardoor die weergave soms verkeerd tekende)."],en:["Clothing Manager is quick again: the ready-made looks built dozens of shaders when opening and redrew your pattern each time — now one shader, the previews are made once and kept, and the sharp 4× pattern is only computed for exports (or choose 'Sharp preview too').","Big patterns are rendered in strips so the graphics card never stalls, and placement in the tile view is no longer recomputed on every redraw (plus a fix for that view sometimes drawing wrong)."]},{v:"7.4.0",nl:["Clothing Manager — patronen vernieuwd: een nieuwe denim-motor (echte garens, 5 bindingen, slub, witte inslag, verfwolken, ring-dye slijtage, stonewash) zonder het dambordeffect, 9 nieuwe denim-looks (raw selvedge, dark rinse, stonewash, vintage, zwart, grijs, wit, ice bleach) en 8 nieuwe stoffen: linnen, tweed, ripstop, sportmesh, leer, suède, puffer en satijn.","Elk patroon ziet er echter uit: een stof-look onder elke print (tricot, twill, canvas, fleece of satijn, inkt die in de stof trekt, slijtage en pluisjes) en 4× anti-aliasing zonder ruitjes of moiré. Tijdens het schuiven blijft het vlot, daarna wordt het scherp berekend.","Plaatsing werkt nu ook voor het Pattern color-bestand: verschuiven, spiegelen en draaien gaan mee in de tegel, naadloos (draaien springt naar hoeken die blijven passen). Nieuw bij Hats: 4 petten met base maps en 3D (Converse 6-panel, Fitted Backwards, Trucker, Trucker Flipped Brim).","Patches: een logo ergens in een grote transparante PNG wordt automatisch bijgeknipt en gecentreerd, en er is een derde materiaal: plastic (glanzende badge, PVC-rubber patch met verhoogde randen, soft-touch, sticker).","Nieuwe kleurkiezer in alle apps (kleurring + driehoek, R/G/B en H/S/V, hex, pipet, merk- en recente kleuren). Video Editor: Rolschok herwerkt met 8 schuiven (hoek, snelheid, in- en uitzoomen, zoom mee-schudden, verschuiven, vloeiend ↔ schokkerig, draaivervaging, randen vullen)."],en:["Clothing Manager — patterns reworked: a new denim engine (real yarns, 5 weaves, slub, white weft, dye clouds, ring-dye wear, stonewash) without the checkerboard look, 9 new denim looks (raw selvedge, dark rinse, stonewash, vintage, black, grey, white, ice bleach) and 8 new fabrics: linen, tweed, ripstop, sports mesh, leather, suede, puffer and satin.","Every pattern looks more real: a fabric look under every print (jersey, twill, canvas, fleece or satin, ink soaking into the fabric, wear and lint) and 4× anti-aliasing with no checkers or moiré. It stays quick while you drag, then renders sharp.","Placement now works for the Pattern color file too: shift, mirror and rotation go into the tile, seamlessly (rotation snaps to angles that keep fitting). New in Hats: 4 caps with base maps and 3D (Converse 6-panel, Fitted Backwards, Trucker, Trucker Flipped Brim).","Patches: a logo somewhere in a big transparent PNG is trimmed and centred automatically, and there is a third material: plastic (glossy badge, PVC rubber patch with raised outlines, soft-touch, sticker).","New colour picker in every app (hue ring + triangle, R/G/B and H/S/V, hex, eyedropper, brand and recent colours). Video Editor: Roll shake reworked with 8 sliders (angle, speed, zoom in and out, zoom pulse, drift, smooth ↔ jerky, rotation blur, fill edges)."]},{v:"7.3.0",nl:["Video Editor — schudden: 11 schudeffecten (handcamera, aardbeving, rolschok, zoomschok, schok in één richting, RGB-schok, stop-motion, VHS-schok, dronken camera, camera-val) en 8 schudovergangen (schokknip, impact, zwiep + schok, aardbeving, glitch-schok, rol-schok, camera-val, zoom-in schok).","Echte skate-montage-effecten: snap zoom naar een punt, schuine camera, Hi8-camcorder, 16mm-film met rode halatie, VHS-pauze, vuile lens in de zon, filmbrand aan de randen en een rode slam-flits. Nieuwe beat-presets zoals aardbeving op de drop.","Montage in één klik: schok en flits op elke landing en snap zoom of impact frame op elke pop, uit het geluid van het board (rechtsklik op een clip → Skate-montage). Elk effect kan zo op vaste momenten van een clip vuren.","Geluid apart regelen: aparte schuiven en dempknoppen voor clipgeluid, muziek, stem en geluidseffecten (knop naast het volume, Alt+S, ook in de mixer en de export). Clipgeluid staat nu meteen op het tabblad Basis van een videoclip.","Sneller laden: lettertypes laden pas als ze gebruikt worden, filmstrookbeelden komen bij het heropenen uit een cache, autosave remt niet meer tijdens het inladen, de laatst gebruikte app staat op de achtergrond klaar en het automatisch vooraf renderen wacht tot alle media binnen zijn."],en:["Video Editor — shake: 11 shake effects (handheld camera, earthquake, roll shake, zoom shake, one-way shake, RGB shake, stop-motion jitter, VHS shake, drunk cam, camera drop) and 8 shake transitions (shake cut, impact, whip + shake, earthquake, glitch shake, roll shake, camera drop, zoom-in shake).","Real skate montage effects: snap zoom to a point, dutch angle, Hi8 camcorder, 16mm film with red halation, VHS pause, dirty lens in the sun, film burn on the edges and a red slam flash. New beat presets such as earthquake on the drop.","One-click montage: shake and flash on every landing and snap zoom or impact frame on every pop, from the board's sound (right-click a clip → Skate montage). Any effect can now fire on fixed moments of a clip.","Set sound separately: separate sliders and mute buttons for clip sound, music, voice and sound effects (button next to the volume, Alt+S, also in the mixer and the export). Clip sound is now right on the Basic tab of a video clip.","Faster loading: fonts load only when used, filmstrip pictures come from a cache when you reopen a project, autosave no longer slows importing, the last app you used is ready in the background and automatic pre-rendering waits until all media is in."]},{v:"7.2.0",nl:["Video Editor — pro montage: ripple-, roll- en slide-trims met een beeld-naast-beeld weergave, een bronviewer (in/uit zetten, invoegen of overschrijven), J- en L-cuts, J/K/L spoelen, een geschiedenislijst, meerdere tijdlijnen en clips nesten (Alt+N), en een clip vervangen met behoud van alle effecten.","Kleurpagina: drie kleurwielen (schaduwen, middentonen, hooglichten), curves (RGB, rood/groen/blauw, verzadiging en tint per kleur), kleur selecteren en apart aanpassen, scopes (waveform, parade, vectorscope, histogram), voor/na in gesplitst beeld en je grade bewaren als .cube LUT.","Motion graphics: bézier-keyframes met een grafiekeditor, het bewegingspad op het beeld, corner pin (een beeld in vier hoeken zetten) met 4-punts tracking, clips aan elkaar koppelen (parenting) en een bewegend ding vervagen met een masker dat meebeweegt.","Audiomixer (Alt+M): per spoor volume, pan, EQ, compressor, solo en mute, een master-EQ met limiter, een loudness-meter met doelen voor YouTube, Apple, TikTok en tv, kleine fades op elke knip tegen klikjes, volumelijnen op de clips (Ctrl+klik = punt) en een VX1000-microfoonklank.","Sneller werken: zware stukken vooraf renderen zodat ze vloeiend afspelen (Ctrl+Enter), een exportwachtrij die op de achtergrond verder exporteert terwijl je blijft monteren, en het voorbeeld op een tweede scherm (Alt+P). Skate-extra's: luchttijd per truc uit het geluid, beeld-in-beeld van een tweede hoek, een slam-reel van al je bails en een spotkaart."],en:["Video Editor — pro editing: ripple, roll and slide trims with a side-by-side view, a source viewer (set in/out, insert or overwrite), J- and L-cuts, J/K/L shuttle, a history list, several timelines and nested clips (Alt+N), and replacing a clip while keeping all its effects.","Colour page: three colour wheels (shadows, midtones, highlights), curves (RGB, red/green/blue, saturation and hue per colour), pick a colour and adjust just that one, scopes (waveform, parade, vectorscope, histogram), before/after split view and saving your grade as a .cube LUT.","Motion graphics: bézier keyframes with a graph editor, the motion path on the picture, corner pin (put a picture into four corners) with 4-point tracking, linking clips together (parenting) and blurring a moving thing with a mask that follows it.","Audio mixer (Alt+M): per track volume, pan, EQ, compressor, solo and mute, a master EQ with limiter, a loudness meter with targets for YouTube, Apple, TikTok and TV, tiny fades on every cut against clicks, volume lines on the clips (Ctrl+click = point) and a VX1000 mic sound.","Work faster: render heavy parts ahead so they play smoothly (Ctrl+Enter), an export queue that keeps exporting in the background while you keep editing, and the preview on a second screen (Alt+P). Skate extras: air time per trick from the sound, picture-in-picture of a second angle, a slam reel of all your bails and a spot card."]},{v:"7.1.0",nl:["Video Editor: camerahoeken synchroniseren op het geluid (twee telefoons, één truc) en wisselen tussen hoeken met Alt+1/2; pops van het board vinden (markers, slow-mo of trucnaam precies op de pop); ruis en wind uit het geluid halen.","Vloeiende slow-mo met echte tussenbeelden, bewegingsonscherpte bij versnellen, sequentiefoto's (de skater meerdere keren in één beeld), fisheye rechtzetten, kleuren gelijktrekken tussen clips en automatisch herkaderen naar 9:16 dat de skater volgt.","Trucnamen-bibliotheek (Shift+T), tekenen op de video met pijlen en cirkels (ook op een bevroren beeld) en een thumbnail-maker voor YouTube, Instagram en TikTok.","Toolkit: merkkit (logo, kleuren, lettertypes voor alle apps), gedeelde bibliotheek, geanimeerd logo als video of GIF vanuit de Logo Maker, lookbook-video en mockup-foto's vanuit de Clothing Manager.","Automatische dagelijkse back-ups van al je projecten naar een map naar keuze (nieuwe installer: Brazy Toolkit Setup 7.1.0), of handmatig als bestand."],en:["Video Editor: sync camera angles by their sound (two phones, one trick) and switch angles with Alt+1/2; find the board's pops (markers, slow-mo or trick name right on the pop); remove noise and wind from the sound.","Smooth slow-mo with real in-between frames, motion blur on speed-ups, sequence shots (the skater several times in one picture), fisheye fix, colour match between clips and automatic 9:16 reframing that follows the skater.","Trick name library (Shift+T), drawing on the video with arrows and circles (also on a frozen frame) and a thumbnail maker for YouTube, Instagram and TikTok.","Toolkit: brand kit (logo, colours, fonts for every app), shared library, animated logo as video or GIF from the Logo Maker, lookbook video and mockup photos from the Clothing Manager.","Automatic daily backups of all your projects to a folder you choose (new installer: Brazy Toolkit Setup 7.1.0), or by hand as a file."]},{v:"7.0.1",nl:["Video Editor: geen zwarte flits meer tussen clips tijdens het afspelen. De volgende clip wordt al op voorhand ingeladen, en als een frame toch nog niet klaar is blijft het vorige beeld staan in plaats van zwart."],en:["Video Editor: no more black flash between clips while playing. The next clip is loaded ahead of time, and if a frame still isn't ready the previous picture stays instead of black."]},{v:"7.0.0",nl:["Skate editor: automatisch monteren op de beat (knippen op de beats, het actiefste stuk van elke clip, drops krijgen zoom en slow-mo), slow-mo precies op de beat en 5 skate-snelheidscurves.","Trick replay in één klik: terugspoelen met VHS-look, herhaling op halve snelheid, bevroren landing en de naam van de truc. Plus motion tracking (tekst volgt de skater) en stabiliseren van schokkerige beelden.","5 skate-sjablonen: skate part (intro, lines met teller en trucnamen, aftiteling), VX1000-part in 4:3, HD-part, TikTok-skateclip en poging vs. gelukt.","Clips labelen als Make of Bail, met spot en skater; filteren en zoeken in je media.","Logo Maker → geanimeerde intro (elke laag komt apart binnen, met lichtstreep) en Clothing → 360°-video van je 3D-model, rechtstreeks in de Video Editor."],en:["Skate editor: auto-edit to the beat (cuts on the beats, the most active part of each clip, drops get zoom and slow-mo), slow-mo right on the beat and 5 skate speed ramps.","Trick replay in one click: rewind with a VHS look, half-speed replay, frozen landing and the trick name. Plus motion tracking (text follows the skater) and stabilising shaky footage.","5 skate templates: skate part (intro, lines with counter and trick names, credits), VX1000 part in 4:3, HD part, TikTok skate clip and try vs. landed.","Tag clips as Make or Bail, with spot and skater; filter and search your media.","Logo Maker → animated intro (every layer comes in on its own, with a light sweep) and Clothing → 360° video of your 3D model, straight into the Video Editor."]},{v:"6.6.0",nl:["Kleine updates: de nieuwe desktop-app downloadt alleen de bestanden die echt veranderd zijn (vaak een paar MB in plaats van 46 MB), gecontroleerd met een vingerafdruk. Nieuwe installer: Brazy Toolkit Setup 6.6.0 (zonder beheerdersrechten).","Lange exports: de pc gaat niet meer in slaapstand zolang de Video Editor exporteert.","Dubbelklikken op een .bzvideo- of .rslogo-bestand in Windows opent het meteen in de juiste app.","Na een crash of stroomuitval laadt de app opnieuw en biedt aan om verder te gaan; de Video Editor bewaart elke wijziging meteen als noodkopie.","Instellingen → Prestatierapport: cijfers over je pc en de apps (beeldsnelheid, trage momenten, geheugen) om te kopiëren en door te sturen. Achter de schermen: opgeruimde tijdlijncode en één commando om een versie uit te brengen."],en:["Small updates: the new desktop app only downloads the files that really changed (often a few MB instead of 46 MB), checked with a fingerprint. New installer: Brazy Toolkit Setup 6.6.0 (no admin rights needed).","Long exports: the PC no longer goes to sleep while the Video Editor is exporting.","Double-clicking a .bzvideo or .rslogo file in Windows opens it straight in the right app.","After a crash or power cut the app loads again and offers to continue; the Video Editor keeps every change as an emergency copy right away.","Settings → Performance report: numbers about your PC and the apps (frame rate, slow moments, memory) to copy and send on. Behind the scenes: tidied timeline code and one command to release a version."]},{v:"6.5.0",nl:["Video Editor — nieuwe tijdlijn: de tijdlijnliniaal blijft zichtbaar bij inzoomen (met tijdcode tot op het beeld), vloeiend zoomen dat de afspeelkop op zijn plaats houdt, echte beelden in de filmstrook en een exacte golfvorm als je ver inzoomt, clipnamen blijven leesbaar, en zoomen of selecteren bouwt de tijdlijn niet meer opnieuw op.","Sneller: clips selecteren is ±7× sneller, voorbeelden in de bibliotheek worden één keer gemaakt en bewaard, en achtergrondwerk wacht terwijl je werkt.","Exporteren: eigen afmetingen (passend of bijgesneden), MOV en MKV, keuze van videocodec (H.264, H.265, VP9, VP8, AV1), bitrate in Mbit/s of een doelgrootte in MB, sleutelbeelden, constante bitrate, codering via grafische kaart of processor, titel als metadata.","Exporteren: geluid aan/uit, audiobitrate, AAC of Opus, 44,1/48 kHz, mono, luidheid gelijktrekken (-14/-16/-23 LUFS), in- en uitfaden, bereik van–tot; JPG/WebP-stilstaand beeld, beeldreeks als ZIP, OGG-audio, GIF met minder kleuren, dithering en herhalen aan/uit.","50 nieuwe overgangen (o.a. kubus, kaart omdraaien, filmbrand, inktvlek, hart, zoom punch, VHS-terugspoelen, stuiteren, smelten), 50 nieuwe effecten (o.a. potloodschets, cartoon, olieverf, nachtzicht, regen, sneeuw, lichtstralen, lensflare, bokeh, blokglitch, halatie) in de nieuwe categorieën Kunst en Natuur, en 50 nieuwe filters."],en:["Video Editor — new timeline: the time ruler stays visible when you zoom in (with timecode down to the frame), smooth zoom that keeps the playhead in place, real frames in the filmstrip and an exact waveform when zoomed in far, clip names stay readable, and zooming or selecting no longer rebuilds the timeline.","Faster: selecting clips is about 7× faster, library previews are made once and kept, and background work waits while you work.","Export: custom size (fit or crop), MOV and MKV, choice of video codec (H.264, H.265, VP9, VP8, AV1), bitrate in Mbit/s or a target size in MB, keyframes, constant bitrate, encoding on the graphics card or processor, title metadata.","Export: sound on/off, audio bitrate, AAC or Opus, 44.1/48 kHz, mono, loudness normalisation (-14/-16/-23 LUFS), fade in and out, from–to range; JPG/WebP still, image sequence as ZIP, OGG audio, GIF with fewer colours, dithering and loop on/off.","50 new transitions (incl. cube, card flip, film burn, ink blot, heart, zoom punch, VHS rewind, bounce, melt), 50 new effects (incl. pencil sketch, cartoon, oil paint, night vision, rain, snow, god rays, lens flare, bokeh, block glitch, halation) in the new Art and Nature categories, and 50 new filters."]},{v:"6.1.2",nl:["Video Editor: schuiven en de afspeelkop reageren vlotter. Het maken van geoptimaliseerde kopieën pauzeert terwijl je sleept, scrubt of afspeelt; scrubben toont nu doorlopend beelden (vooruit zonder telkens opnieuw te zoeken); scrub-geluid en keyframe-weergave kosten veel minder; op lichtere pc's is het voorbeeld tijdens het slepen iets kleiner en meteen weer scherp als je loslaat.","Tijdlijn-zoom: bredere zoomschuif met − en + knoppen, zoomen rond de afspeelkop, en Ctrl+scrollen werkt overal op de tijdlijn (ook boven de spoornamen en de knoppenbalk). Skimmen, scrub-geluid, volgen en spoorhoogte zitten nu samen onder de Weergave-knop."],en:["Video Editor: sliders and the playhead respond more smoothly. Making optimized copies pauses while you drag, scrub or play; scrubbing now shows frames continuously (forward without seeking again each time); scrub audio and keyframe display cost far less; on lighter PCs the preview is slightly smaller while dragging and sharp again as soon as you let go.","Timeline zoom: a wider zoom slider with − and + buttons, zooming around the playhead, and Ctrl+scroll works anywhere on the timeline (also over the track names and the toolbar). Skimming, scrub audio, follow and track height are now together under the View button."]},{v:"6.1.1",nl:["Letters worden niet meer even wazig of lichter als je met de muis over knoppen, kaarten en presets gaat (vooral zichtbaar op Windows met schermschaal 125 % of 150 %). Hover-effecten verschuiven of filteren de tekst niet meer; ze tonen nu een rand, schaduw of kleur."],en:["Letters no longer briefly blur or turn lighter when you hover over buttons, cards and presets (most visible on Windows with 125 % or 150 % display scaling). Hover effects no longer move or filter the text; they show a border, shadow or colour instead."]},{v:"6.1.0",nl:["Sneller op elke pc: de toolkit herkent je pc (licht, gemiddeld, krachtig) en past zich aan; Instellingen → Prestaties: Auto, Kwaliteit of Snel. Apps die niet op het scherm staan tekenen niet meer op de achtergrond.","Video Editor: het voorbeeld past zijn resolutie live aan zodat afspelen vloeiend blijft, en zware video's (4K, 60 fps, HEVC) krijgen automatisch een lichte kopie om vlot mee te werken — de export gebruikt altijd de originelen.","Video Editor: hoofdvolume-schuif en dempknop bij de speler; volume, pan en audio-effecten veranderen meteen hoorbaar tijdens het afspelen.","Video Editor: effecten op de beat (zoom punch, flits, fisheye-pulse, schok, freeze…) die automatisch de muziek volgen; nieuwe Skate-categorie met een echte fisheye (MK1) met zwarte lensrand, VX1000-look, camcorder-REC, Super 8, ghost trail, stotteren, impact frame, snelheidslijnen, 4:3-kader, tilt-shift, datamosh en meer.","Tijdlijn: mes (B), slip (Y / Alt+slepen), meekijken onder de muis, vloeiend meeschuiven, automatisch scrollen aan de rand, spoorhoogtes, typ een tijd in de tijdcode, clips koppelen (Ctrl+L), geluid bij scrubben, scrollen met het wieltje. De volledig-scherm-knop werkt nu in elke app (ook F11)."],en:["Faster on every PC: the toolkit recognises your PC (light, medium, powerful) and adapts; Settings → Performance: Auto, Quality or Fast. Apps that are not on screen no longer draw in the background.","Video Editor: the preview adapts its resolution live so playback stays smooth, and heavy videos (4K, 60 fps, HEVC) automatically get a light copy to edit with — the export always uses the originals.","Video Editor: master volume slider and mute button at the player; volume, pan and audio effects change audibly right away while playing.","Video Editor: effects on the beat (zoom punch, flash, fisheye pulse, shake, freeze…) that follow the music automatically; new Skate category with a real fisheye (MK1) with black lens ring, VX1000 look, camcorder REC, Super 8, ghost trail, stutter, impact frame, speed lines, 4:3 frame, tilt-shift, datamosh and more.","Timeline: blade (B), slip (Y / Alt+drag), hover skimming, smooth follow, auto-scroll at the edges, track heights, type a time in the timecode, link clips (Ctrl+L), audio while scrubbing, wheel scrolling. The fullscreen button now works in every app (F11 too)."]},{v:"6.0.0",nl:["Brazy Toolkit is nu de hoofdapp met drie apps: Brazy Clothing Manager (kleding, skate, patches), Brazy Logo Maker en de nieuwe Brazy Video Editor. Wissel met de app-knop bovenaan; recent werk van alle apps staat op het startscherm.","Video Editor: tijdlijn met sporen en magnetisch hoofdspoor, knippen, inkorten, verschuiven met uitlijnen op randen, markers en beats; keyframes op elke waarde; snelheid en snelheidscurves, achterstevoren, beeld bevriezen.","Video Editor: 37 effecten, 18 filters + LUT's, 28 overgangen, 18 mengmodi, maskers, chroma key, aanpassingslagen, vervaagde achtergrond; geanimeerde tekst met de fonts van de Logo Maker, ondertitels (typen tijdens afspelen, SRT), stickers, emoji en iconen.","Video Editor: audio met golfvormen, volume-keyframes, fades, EQ, echo, galm, stemeffecten, toonhoogte behouden, automatische ducking, beat-detectie, voice-over en geluidseffecten.","Video Editor: export naar MP4 (H.264 + AAC), WebM, GIF, M4A, WAV of PNG met controle vooraf; sjablonen, 44 aanpasbare sneltoetsen, Ctrl+K. Nieuw in de Logo Maker: Exporteren → Video Editor."],en:["Brazy Toolkit is now the main app with three apps: Brazy Clothing Manager (clothing, skate, patches), Brazy Logo Maker and the new Brazy Video Editor. Switch with the app button at the top; recent work from every app is on the home screen.","Video Editor: multi-track timeline with a magnetic main track, split, trim, move with snapping to edges, markers and beats; keyframes on every value; speed and speed curves, reverse, freeze frame.","Video Editor: 37 effects, 18 filters + LUTs, 28 transitions, 18 blend modes, masks, chroma key, adjustment layers, blurred background; animated text with the Logo Maker's fonts, captions (type while playing, SRT), stickers, emoji and icons.","Video Editor: audio with waveforms, volume keyframes, fades, EQ, echo, reverb, voice effects, keep pitch, automatic ducking, beat detection, voice-over and sound effects.","Video Editor: export to MP4 (H.264 + AAC), WebM, GIF, M4A, WAV or PNG with checks first; templates, 44 customisable shortcuts, Ctrl+K. New in the Logo Maker: Export → Video Editor."]},{v:"5.1.0",nl:["Logo: echte vectorpaden — Bézier-pen, knooppunten-gereedschap (A), booleans (samenvoegen, aftrekken, snijden, uitsluiten, verdelen), verschuiven, contour naar vorm, tekst/vorm → pad, bewerkbare SVG-import.","Logo: tot 8 contouren met elk dekking (0% = open rand), positie binnen/midden/buiten en hoeken; tekst op een pad, verticale tekst, per-letter aanpassen, smaller/breder, schuintrekken.","Logo: lagen met geneste groepen, zoeken, labels, isoleren, maskers, alfa-vergrendeling, samenvoegen; selectie schalen/draaien als geheel; spiegelen en radiale herhaling.","Logo: stalen met gekoppelde kleuren, kleurvarianten, kleur overal vervangen, nieuwe effecten (binnengloed, rand, overlay, chromatisch, vervorming, worn/vintage/zeefdruk), opschoon-venster met voorbeeld voor afbeeldingen.","Logo: export-venster met selectie, meerdere maten → ZIP, controles vóór export en Reskate-presets; eerdere versies, opslaan als, eigen sjablonen, Ctrl+K en rechtsklikmenu, eigen sneltoetsen."],en:["Logo: real vector paths — Bézier pen, node tool (A), booleans (union, subtract, intersect, exclude, divide), offset, outline to shape, text/shape → path, editable SVG import.","Logo: up to 8 outlines, each with opacity (0% = open gap), inside/centre/outside position and corners; text on a path, vertical text, per-letter adjustments, condensed/expanded, skew.","Logo: layers with nested groups, search, labels, isolate, masks, alpha lock, merge; scale/rotate a selection as a whole; mirroring and radial repeat.","Logo: swatches with linked colours, colourways, replace a colour everywhere, new effects (inner glow, edge, overlay, chromatic, distortion, worn/vintage/screen print), clean-up dialog with preview for images.","Logo: export dialog with selection, several sizes → ZIP, checks before export and Reskate presets; earlier versions, save as, your own templates, Ctrl+K and right-click menu, custom shortcuts."]},{v:"5.0.0",nl:["De toolkit heet nu Brazy Toolkit, met een nieuwe, rustigere look: één signaalkleur (limoengroen), vlakke panelen, geen gloed of verlopen meer.",'Zijbalk in categorieën die je kunt in- en uitklappen: Logo, Kleding, Skate. "Logo & patches" heet nu Logo; de embroidery-tool heet Patches.','De losse Patroon-generator is opgegaan in Kleding: alle 39 patronen zitten in de tab Patroon, met een nieuw blok "Patroon gebruiken" (tegel bekijken, op het kledingstuk, exporteren). "Maak een patroon" op de startpagina opent dat meteen.',"Minder druk: geavanceerde blokken (aanpassen, mixen, kanaal-maps, export van base-maps…) starten ingeklapt en onthouden hoe je ze laat.","10 nieuwe Brazy-logo's in de Logo Maker (B-merk, woordmerk, gestapeld, deck, hex-bliksem, clubpatch, puff-sticker, mini-merk, echo, grip-strip) — bovenaan bij Sjablonen.","Opgelost: sjabloon-voorbeelden van niet-vierkante sjablonen waren verschoven; recente projecten misten een wijziging van de laatste halve seconde; Engelse meldingen in Kleding.","Je projecten, instellingen en recente projecten blijven gewoon werken."],en:["The toolkit is now called Brazy Toolkit, with a new, calmer look: one signal colour (acid lime), flat panels, no more glow or gradients.",'Sidebar in collapsible categories: Logo, Clothing, Skate. "Logo & patches" is now Logo; the embroidery tool is called Patches.','The separate Pattern generator is now part of Clothing: all 39 patterns live in the Pattern tab, with a new "Use this pattern" block (view the tile, on the garment, export). "Make a pattern" on the home page opens it directly.',"Less clutter: advanced blocks (adjust, mix, channel maps, base-map export…) start folded and remember how you leave them.","10 new Brazy logos in the Logo Maker (B mark, wordmark, stacked, deck, hex bolt, club patch, puff sticker, mini mark, echo, grip strip) — at the top of Templates.","Fixed: template previews of non-square templates were off-centre; recent projects missed a change made in the last half second; English messages in Clothing.","Your projects, settings and recent projects keep working."]},{v:"4.6.0",nl:['Nieuw: grip cutout bij Skateboards (tab "Uitsparing"). Snij de grip weg zodat het hout zichtbaar wordt — live op het 3D-board.',"Begin met 12 vormen (strepen, venster, neus & tail, ruit, gaten…), met het patroon uit de tab Patroon, of met je eigen logo/beeld (ook rechtstreeks vanuit de Logo Maker). Werk bij met een penseel: wegsnijden of grip terug, op het board of plat.","Exporteert param_gripcutout_osk (512×2048, rood = grip, met dezelfde fijne korrel in groen als de originelen) — importeer in Studio bij een Grip cutout. Een bestaande cutout-_osk kan je openen en aanpassen."],en:['New: grip cutout in Skateboards ("Cutout" tab). Cut the grip away so the wood shows — live on the 3D board.',"Start from 12 shapes (stripes, window, nose & tail, check, holes…), from the pattern in the Pattern tab, or from your own logo/image (also straight from the Logo Maker). Touch up with a brush: cut away or grip back, on the board or flat.","Exports param_gripcutout_osk (512×2048, red = grip, with the same fine grain in green as the originals) — import it in Studio on a Grip cutout. You can open and edit an existing cutout _osk."]},{v:"4.5.0",nl:['Nieuw: eigen logo-slot van kledingstukken. Kledingstukken met een eigen logo (zoals de carpenter jeans: logo_basic_adv_2x1_001 op de achterzak) tonen dat logo nu op het 3D-model. Onder Penseel → "Logo-slot" vervang je het door je eigen logo (geborduurd of gedrukt), haal je het weg of zet je het origineel terug.','"Alles exporteren" schrijft de drie logo-maps met de originele namen (_c, _ny, _osk; 1024×512), klaar om in Studio bij Graphic color / normal / mask te importeren.','Vanuit de Logo Maker of "Logo → borduursel" kan je een logo of patch nu meteen in dat logo-slot zetten (knop "→ In het logo-slot"). De patch-tool heeft ook een 1024×512-formaat.'],en:['New: a garment\'s own logo slot. Garments with their own logo (like the carpenter jeans: logo_basic_adv_2x1_001 on the back pocket) now show that logo on the 3D model. Under Brush → "Logo slot" you replace it with your own logo (embroidered or printed), remove it or restore the original.','"Export everything" writes the three logo maps with their original names (_c, _ny, _osk; 1024×512), ready to import in Studio on Graphic color / normal / mask.','From the Logo Maker or "Logo → embroidery" you can now put a logo or patch straight into that slot (button "→ Into the logo slot"). The patch tool also has a 1024×512 size.']},{v:"4.4.0",nl:['Nieuw: logo\'s op kleding. In de Logo Maker (Exporteren → "Op kleding zetten") of bij "Logo → borduursel" kies je het kledingstuk en sleep je het logo op zijn plaats — op het 3D-model staat het meteen rechtop. Kan ook met een eigen PNG onder Penseel → Logo / sticker.',"Nieuw: recente projecten op het startscherm. Logo's, kledingstukken (patroon, penseelwerk en stickers) en patches worden vanzelf bewaard; klik om verder te werken.","Nieuw: Simpel / Pro-schakelaar bovenaan. Simpel toont alleen het belangrijkste; Pro alle instellingen.",'Nieuw: zoeken met Ctrl+K — typ wat je wil doen ("exporteer", "camo", "sticker", een modelnaam…) en druk Enter.',"Nieuw: 14 kant-en-klare looks voor kleding (vintage wash, acid wash, legercamo, flanel, tie-dye, racing ruit…): patroon, kleuren, slijtage en stof in één klik."],en:['New: logos on clothing. In the Logo Maker (Export → "Put on clothing") or in "Logo → embroidery" you pick the garment and drag the logo into place — on the 3D model it stands upright right away. Also works with your own PNG under Brush → Logo / sticker.',"New: recent projects on the home screen. Logos, garments (pattern, brush work and stickers) and patches are saved automatically; click to carry on.","New: Simple / Pro switch at the top. Simple shows only the essentials; Pro shows every setting.",'New: search with Ctrl+K — type what you want to do ("export", "camo", "sticker", a model name…) and press Enter.',"New: 14 ready-made looks for clothing (vintage wash, acid wash, army camo, flannel, tie-dye, racing check…): pattern, colours, wear and fabric in one click."]},{v:"4.3.0",nl:["Logo Maker vernieuwd: strak nieuw ontwerp (zijbalk met tabbladen, zwevende gereedschapsbalk, inklapbare secties, Ontwerp/Lagen-tabs) en vloeiender slepen, schalen en kleuren kiezen.","Kleurpaneel herschreven: verlopen met versleepbare kleurstops en 7 stijlen, 16 patronen (strepen, ruit, camo, luipaard, halftoon…), snellere kleurkiezer.","Overal volledige kleuropties: randen, achtergrondvak, schaduw, gloed, 3D en de canvasachtergrond kunnen nu ook verloop of patroon zijn. Verlopen op symbolen werken weer.","Sjablonen kun je nu ook toevoegen aan je bestaande ontwerp (+ op een sjabloon); 14 nieuwe sjablonen, 18 nieuwe vormen, emoji-tab, hulp-tab met sneltoetsen, meer snelle stijlen en penseelvormen.","Vergrendelde lagen kun je weer aanklikken (en ontgrendelen), afbeeldingen snappen bij schalen aan de canvasranden, grote PNG's vertragen niet meer, focus-modus (Tab) en volledig scherm (F11). Dubbelklik-sluiten van het zijpaneel is weg.","Kleding: Ctrl+Z werkt nu ook na 3D-penselen; de cursor blijft zichtbaar bij vulemmer en pipet; klonen herwerkt (kopieert het echte beeld, met 'uitgelijnd'-optie).","Kleding: 'bakken' bakt nu alles wat je veranderde (patroon + penseelwerk) en 'Alles exporteren' exporteert echt alle basemaps.","Logo → borduursel: knop 'Logo verwijderen', meer camerastanden (voor, schuin, zij, boven, laag, dichtbij, draaien), pannen met rechtermuis, lens-schuif en extra realisme (glans, draaiing, draadvariatie, pluis)."],en:["Logo Maker redesigned: clean new look (tabbed side rail, floating tool dock, collapsible sections, Design/Layers tabs) and smoother dragging, resizing and colour picking.","Colour panel rewritten: gradients with draggable colour stops and 7 styles, 16 patterns (stripes, check, camo, leopard, halftone…), faster colour picker.","Full colour options everywhere: outlines, background box, shadow, glow, 3D and the canvas background can now be a gradient or pattern too. Gradients on symbols work again.","Templates can now also be added to your existing design (+ on a template); 14 new templates, 18 new shapes, emoji tab, help tab with shortcuts, more quick styles and brush shapes.","Locked layers can be clicked again (and unlocked), images snap to the canvas edges when resizing, big PNGs no longer slow things down, focus mode (Tab) and fullscreen (F11). Double-click-to-close of the side panel is gone.","Clothing: Ctrl+Z now also works after 3D painting; the cursor stays visible with fill bucket and eyedropper; clone reworked (copies the real image, with an 'aligned' option).","Clothing: 'bake' now bakes everything you changed (pattern + brush work) and 'Export everything' really exports all basemaps.","Logo → embroidery: 'Remove logo' button, more camera views (front, angle, side, top, low, close-up, spin), right-drag panning, lens slider and extra realism (sheen, twist, thread variation, fuzz)."]},{v:"4.2.0",nl:['Kleding: de tab "Kledingstuk" is weg — zones, mengmodus en plaatsing staan nu gewoon onder "Patroon".','Nieuwe tab "Penseel" met 19 gereedschappen: patroon erbij/weg, effen kleur (op de stof of dekkend), pipet, "vul onderdeel" (mouw, zak, zool… in één klik), lichter/donkerder, feller/ontkleuren, tint verschuiven, en Base C retoucheren: kloonstempel, vervagen, uitsmeren, verscherpen, herstellen.',"Schilder rechtstreeks op het 3D-model: het penseel loopt over de naden heen en komt in de juiste base map terecht. Spiegelen links ↔ rechts, alleen binnen een zone, pendruk, dekking/flow/hardheid/tussenafstand en penseel-presets.","Je kleurwerk komt mee bij exporteren (Base C _painted), ook als het patroon via de Pattern color-slot gaat.","Logo Maker: kleurenpaneel zoals in Canva — effen en kleurovergangen met 6 stijlen, documentkleuren, eigen kleuren, passende kleuren, paletten, zoeken op naam of #hex en kleurenpipet.","Logo Maker: tekst vervormen (boog, golf, bol, vlag, stijgen, perspectief), nieuwe effecten Echo, Glitch, Splice, Hol en Achtergrondvlak, meerdere lagen selecteren/uitlijnen/verdelen/groeperen, stijl kopiëren & plakken, raster en hulplijnen, afbeelding aanpassen, kleuren husselen, voorbeeld op kleding/pet/board en JPG/WebP-export."],en:['Clothing: the "Garment" tab is gone — zones, blend mode and placement now simply live under "Pattern".','New "Brush" tab with 19 tools: pattern in/out, solid colour (on the fabric or opaque), eyedropper, "fill part" (sleeve, pocket, sole… in one click), lighten/darken, saturate/desaturate, hue shift, and Base C retouching: clone stamp, blur, smudge, sharpen, restore.',"Paint straight on the 3D model: the brush crosses seams and lands in the right base map. Mirror left ↔ right, only inside one zone, pen pressure, opacity/flow/hardness/spacing and brush presets.","Your colour work is included when exporting (Base C _painted), also when the pattern goes through the Pattern color slot.","Logo Maker: Canva-style colour panel — solid colours and gradients with 6 styles, document colours, your own colours, matching colours, palettes, search by name or #hex and a colour eyedropper.","Logo Maker: warp text (arch, wave, bulge, flag, rise, perspective), new effects Echo, Glitch, Splice, Hollow and Background box, select/align/distribute/group several layers, copy & paste style, grid and guides, image adjustments, colour shuffle, preview on clothing/cap/board and JPG/WebP export."]},{v:"4.1.0",nl:["Nieuw: Logo Maker (Logo's & patches) — ontwerp zelf een logo zoals in Canva/Photoshop, met lagen, mengmodi en clip-maskers.","45 ingebouwde fonts in stijlen Street, Varsity, Gothic, Retro, Script en Clean, plus Google Fonts (online) en je eigen .ttf/.otf-fonts.","Vormen en badges (schild, lint, ticket, starburst, stempel…), 110+ iconen, pen, penseel, gum, vulemmer en pipet.","Per laag: kleurverlopen (chrome, goud, neon…), meerdere randen, schaduw, gloed, 3D-diepte, reliëf, binnenschaduw en texturen (grunge, krassen, halftone). Gebogen tekst.","14 sjablonen en snelle stijlen (Sticker, Varsity, 3D pop, Chrome, Neon…).",'Export als PNG of SVG, als Graphic-logo (_co, bv. 128×512) of met één klik naar "Logo → borduursel / metaal". Projecten opslaan als .rslogo.'],en:["New: Logo Maker (Logos & patches) — design your own logo like in Canva/Photoshop, with layers, blend modes and clipping masks.","45 built-in fonts in Street, Varsity, Gothic, Retro, Script and Clean styles, plus Google Fonts (online) and your own .ttf/.otf fonts.","Shapes and badges (shield, ribbon, ticket, starburst, stamp…), 110+ icons, pen, brush, eraser, fill bucket and eyedropper.","Per layer: gradients (chrome, gold, neon…), multiple outlines, drop shadow, glow, 3D extrude, bevel, inner shadow and textures (grunge, scratches, halftone). Curved text.","14 templates and quick styles (Sticker, Varsity, 3D pop, Chrome, Neon…).",'Export as PNG or SVG, as a Graphic logo (_co, e.g. 128×512) or in one click to "Logo → embroidery / metal". Save projects as .rslogo.']},{v:"4.0.0",nl:["Volledig nieuwe, rustige indeling: de editor heeft 4 stappen — Patroon · Kledingstuk · Base maps · Export.",'Secties zijn inklapbaar en de uitleg verschijnt alleen als je op ⓘ klikt (of zet "Uitleg altijd tonen" aan in ⚙).','Werkbalk op één rij; alle weergave-opties (licht, naadkleur, zones, 3D-inzet, voor/na…) zitten in het menu "Weergave".',"Nieuw: mengmodus (Vermenigvuldigen · Behoud schaduw & plooien · Alleen kleur · Vervangen), patroonsterkte en spiegelen.",'Nieuw: "Alles exporteren" — patroon, gebakken kleurmap en aangepaste base maps in één klik, met overzicht vooraf.',"Nieuw: sneltoetsen (1/2/3 = Tegel/UV/3D, F = reset, ? = overzicht) en resetknoppen voor plaatsing en base maps.",'Toolkit: instellingenmenu (⚙), smalle zijbalk als optie en een nieuwe startpagina met "Verder waar je was".'],en:["Completely new, calm layout: the editor has 4 steps — Pattern · Garment · Base maps · Export.",'Sections fold away and explanations only appear when you click ⓘ (or switch on "Always show explanations" in ⚙).','Toolbar on one row; all view options (light, seam colour, zones, 3D inset, before/after…) are in the "View" menu.',"New: blend mode (Multiply · Keep shading & folds · Colour only · Replace), pattern strength and mirroring.",'New: "Export everything" — pattern, baked colour map and edited base maps in one click, with a preview of what you get.',"New: shortcuts (1/2/3 = Tile/UV/3D, F = reset, ? = overview) and reset buttons for placement and base maps.",'Toolkit: settings menu (⚙), optional compact sidebar and a new home page with "Continue where you left off".']},{v:"3.4.4",nl:['Nieuw 3D-model: Overhemd Button-up Loose (Tops → Polo & overhemd), met eigen type "Overhemd" en ingebouwde base maps.',"Ingebouwde base maps (BM) voor 4 schoenen: Adidas Aloha Super, Busenitz Pro, Campus ADV en Free Hiker 3 Low GTX."],en:['New 3D model: Button-up Shirt Loose (Tops → Polo & button-up), with its own "Button-up shirt" type and built-in base maps.',"Built-in base maps (BM) for 4 shoes: Adidas Aloha Super, Busenitz Pro, Campus ADV and Free Hiker 3 Low GTX."]},{v:"3.4.3",nl:['Nieuwe schakelaar "Patroon: aan / uit" (bovenaan en in de tab Base maps, sneltoets P): zet het patroon uit om een bestaande Base color / Base C gewoon te bewerken — weergave, 3D en exports tonen dan alleen de base map met je aanpassingen.'],en:['New "Pattern: on / off" switch (top bar and the Base maps tab, shortcut P): turn the pattern off to simply edit an existing Base color / Base C — view, 3D and exports then show only the base map with your edits.']},{v:"3.4.2",nl:["Originele base maps ingebouwd (BM) voor 8 broeken: Jeans Flared, Jeans Carpenter Loose, Jeans Punk Turn-up, Leggings Mid-Waist, Track Pants Loose, Track Pants Relaxed, Adidas Track Loose en Adidas XPL Cargo — alle 10 broeken hebben nu hun eigen maps.","Snel van model wisselen laat geen maps van het vorige model meer achter."],en:["Original base maps built in (BM) for 8 pants: Jeans Flared, Jeans Carpenter Loose, Jeans Punk Turn-up, Leggings Mid-Waist, Track Pants Loose, Track Pants Relaxed, Adidas Track Loose and Adidas XPL Cargo — all 10 pants now have their own maps.","Switching models quickly no longer leaves maps of the previous model behind."]},{v:"3.4.1",nl:["Jeans Regular Fit: originele base maps ingebouwd (BM).",'Slice-nummers zijn nu dezelfde als in ReSkate (_slice0 = slice 0): eigen maps met "slice0/slice1" in de naam komen meteen op de juiste plek op het 3D-model.'],en:["Jeans Regular Fit: original base maps built in (BM).",'Slice numbers now match ReSkate (_slice0 = slice 0): your own maps with "slice0/slice1" in the name land on the right part of the 3D model right away.']},{v:"3.4.0",nl:["Losse Patroongenerator (Generators): alleen patronen maken en exporteren, zonder kledingstuk.","Logo & patches: ongedaan maken / opnieuw (knoppen + Ctrl+Z / Ctrl+Y).","Klik op Pants, Shoes, Tops… opent de lijst; nog een klik klapt hem dicht.","Live 3D-inzet: penseel in de UV- of tegelweergave en zie het resultaat meteen op het 3D-model (S/M/L, ⤢ = groot).","Meer camera: verschuiven (rechtsklik/Shift-slepen), vaste aanzichten, automatisch draaien, dubbelklik = reset, verder in- en uitzoomen.",'Updates: kleine .rsupd-bestanden — dubbelklikken of de knop "Update" en je bent bij.'],en:["Separate Pattern generator (Generators): just make and export patterns, no garment needed.","Logos & patches: undo / redo (buttons + Ctrl+Z / Ctrl+Y).","Clicking Pants, Shoes, Tops… opens the list; another click folds it.","Live 3D inset: brush in the UV or tile view and see the result on the 3D model right away (S/M/L, ⤢ = big).","More camera: pan (right/Shift-drag), fixed views, auto-spin, double-click = reset, wider zoom.",'Updates: small .rsupd files — double-click or the "Update" button and you are up to date.']},{v:"3.3.1",nl:["Skateboards = bovenkant (grip): standaard krijgt alleen de griptape een patroon; de onderkant (deck graphic) wordt een apart type.","Bakken levert alleen de maps die je echt veranderd hebt."],en:["Skateboards = top side (grip): by default only the grip tape gets a pattern; the bottom (deck graphic) becomes its own type.","Baking only outputs the maps you actually changed."]},{v:"3.3.0",nl:["Nieuwe categorie Skate → Skateboards: Popsicle deck + grip met 3D-model en ingebouwde maps; bakken naar Graphic color (512×2048) / Base color (1024×2048).","Patronen blijven vierkant en even groot op niet-vierkante maps."],en:["New category Skate → Skateboards: Popsicle deck + grip with 3D model and built-in maps; baking to Graphic color (512×2048) / Base color (1024×2048).","Patterns stay square and equally sized on non-square maps."]},{v:"3.2.0",nl:["Ingebouwde base maps (label BM): Jeans Baggy, 4 basketbalshorts, 2 trackjacks, 2 T-shirts, Athletic Puffy, beanie en pet laden meteen hun originele maps — zones, slijtage en naden werken zonder iets te slepen.","Een sectie openen toont direct de basis-maps; je eigen maps vervangen de ingebouwde automatisch.","Modellen half zo groot (WebP) en ze laden al zodra je erover beweegt; je laatst gebruikte model gaat vanzelf weer open.","Zoekbalk en inklapbare groepen in de modellenlijst.","Installer (Setup.exe) en web-pakket om door te sturen naar vrienden."],en:["Built-in base maps (BM label): Jeans Baggy, 4 basketball shorts, 2 track jackets, 2 T-shirts, Athletic Puffy, beanie and cap load their original maps right away — zones, wear and seams work without dropping anything.","Opening a section shows its base maps straight away; your own maps replace the built-in ones automatically.","Models are half the size (WebP) and start loading as soon as you hover them; your last model reopens by itself.","Search box and collapsible groups in the model list.","Installer (Setup.exe) and web package to send to friends."]},{v:"3.1.0",nl:["Desktop-app (ReSkate Toolkit.exe): gebruikt altijd je echte videokaart, geen browser-limieten, onthoudt venster en instellingen.",'Exportmap: kies één keer een map en elke export wordt er direct in opgeslagen, zonder "Opslaan als".',"12 sneakers met eigen 3D-look (sneakers, skateschoenen, high-tops, outdoor) — 63 modellen."],en:["Desktop app (ReSkate Toolkit.exe): always uses your real graphics card, no browser limits, remembers window and settings.",'Export folder: pick a folder once and every export is saved straight into it, no "Save as".',"12 sneakers with their own 3D look (sneakers, skate shoes, high-tops, outdoor) — 63 models."]},{v:"3.0.0",nl:["Elk 3D-model brengt nu zijn eigen originele look mee (kleur + plooien/naden uit de normal map): je patroon ligt meteen realistisch op het model, ook zonder base maps.",'Knop "Origineel" in 3D om het item te zien zoals het in de game is.','Modellen staan in de map "models" naast de toolkit en laden pas als je erop klikt: de toolkit zelf is weer klein en snel.'],en:["Every 3D model now brings its own original look (colour + folds/seams from its normal map): your pattern sits realistically on the model right away, even without base maps.",'"Original" toggle in 3D to see the item as it is in game.','Models live in the "models" folder next to the toolkit and load only when clicked: the toolkit itself is small and fast again.']},{v:"2.9.0",nl:["12 shirts erbij (T-shirts, longsleeves, crop, hoodies, sweater, polo's, overhemd) — 51 modellen."],en:["12 more shirts (tees, longsleeves, crop, hoodies, sweatshirt, polos, button-up) — 51 models."]},{v:"2.8.0",nl:["11 tops erbij (jassen, hoodie, varsity, colbert, motorjas, jeansjacks, coach jacket, 2 puffers, sportbeha) — 39 modellen.","Ondersteuning voor 3 slices (motorjas).","Modellijsten gegroepeerd (Jassen, Puffers & coats, Shirts, Sport)."],en:["11 more tops (jackets, hoodie, varsity, blazer, motorcycle, denim jackets, coach jacket, 2 puffers, sports bra) — 39 models.","Support for 3 slices (motorcycle jacket).","Model lists grouped (Jackets, Puffers & coats, Shirts, Sport)."]},{v:"2.7.0",nl:["7 modellen erbij onder Shorts (Thrasher, Nike ×2, HUF, cut-offs, ondershort, ondergoed) — 28 modellen in totaal."],en:["7 more models under Shorts (Thrasher, Nike ×2, HUF, cut-offs, undershorts, underwear) — 28 models in total."]},{v:"2.6.0",nl:["9 shorts-modellen + Adidas XPL Cargo en Legging toegevoegd aan de 3D-bibliotheek (21 modellen).","Slices volgen nu het model (bv. fietsbroekje = 2 slices)."],en:["9 shorts models + Adidas XPL Cargo and Leggings added to the 3D library (21 models).","Slices now follow the model (e.g. bike shorts = 2 slices)."]},{v:"2.5.0",nl:["3D-modelbibliotheek: 8 broeken, de Adidas-jas en het T-shirt zitten ingebouwd. Klik links onder Pants/Tops op een model en het opent meteen in 3D."],en:["3D model library: 8 trousers, the Adidas jacket and the T-shirt are built in. Click a model under Pants/Tops on the left and it opens in 3D right away."]},{v:"2.4.0",nl:["🧊 3D-weergave: sleep het .glb-model van een item bij de base maps en zie patroon, zones, kleuren en penseel live op het echte model (draaien + zoomen). Slices worden automatisch herkend."],en:["🧊 3D view: drop an item's .glb model with the base maps and see pattern, zones, colours and brush live on the real model (rotate + zoom). Slices are detected automatically."]},{v:"2.3.0",nl:["15 nieuwe patronen (39 in totaal): slangenhuid, marmer, bloemen, vlammen, galaxy, glitch, terrazzo, figuurtjes (ster/hart/smiley/bliksem/kruis), halftone, chevron, golven, raster, tie-dye cirkels, ombré en breisel."],en:["15 new patterns (39 in total): snakeskin, marble, flowers, flames, galaxy, glitch, terrazzo, shapes (star/heart/smiley/bolt/cross), halftone, chevron, waves, grid, bullseye tie-dye, ombré and knit."]},{v:"2.2.0",nl:["Nieuw hoed-type: Cap / trucker (basis: BallCapTruckerNoRope). Werkt zoals kleding (grijze Base color) met zones voorpanelen + bandje / zijkant + achterkant / klep."],en:["New hat type: Cap / trucker (based on BallCapTruckerNoRope). Works like clothing (grey Base color) with zones front panels + strap / sides + back / brim."]},{v:"2.1.0",nl:["Nieuw: Hats · Beanie (basis: CarpetCo BeanieWatch). Base color is hier de print zelf, dus patroon of kleur vervangt die (de breistructuur komt uit Base normal).",'Caps en bucket hats staan klaar als "binnenkort".'],en:["New: Hats · Beanie (based on CarpetCo BeanieWatch). Base color is the print itself here, so pattern or colour replaces it (the knit comes from Base normal).",'Caps and bucket hats are listed as "coming soon".']},{v:"2.0.0",nl:["Nieuw modern uiterlijk voor de hele toolkit.","Penseel: schilder precies waar het patroon wel/niet komt (met zachte rand, dekking en sneltoetsen).","Zones per stuk op Origineel, Patroon of Kleur zetten (bv. strepen een eigen kleur).","Patroon draaien en verschuiven op het kledingstuk; voor/na-schuifje.","Ongedaan maken / opnieuw (Ctrl+Z / Ctrl+Y).",'Looks bewaren met miniatuur, exporteren/importeren; kleurpaletten, 🎲 en "Verras me".',"Sneller: alleen gewijzigde maps worden opnieuw berekend."],en:["New modern look for the whole toolkit.","Brush: paint exactly where the pattern goes or not (soft edge, opacity, shortcuts).","Set each zone to Original, Pattern or Colour (e.g. stripes in the
